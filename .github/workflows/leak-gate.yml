name: leak-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files for personal data
        run: scripts/check-public-tree

      - name: Reject unsafe Gatekeeper advice
        run: |
          if git grep -nE -e 'master-disable' -e 'xattr -cr' -- . ':!.github/workflows/leak-gate.yml'; then
            echo "Unsafe Gatekeeper advice found in tracked files." >&2
            exit 1
          fi
