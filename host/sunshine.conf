# Managed by diarchy. Credentials and pairing state live outside this file.
locale = en
sunshine_name = host
min_log_level = info
system_tray = disabled

keyboard = enabled
mouse = enabled
controller = disabled
high_resolution_scrolling = enabled

stream_audio = disabled
# adapter_name and encoder are deliberately absent: `diarchy-host stream start` pins them to the GPU that renders the
# captured output (nvenc on NVIDIA, vaapi elsewhere). diarchy-check-sunshine-log rejects software encoding.
# output_name is also absent: the `sunshine` wrapper writes it at every start (name of the selected output).
capture = wlr
max_bitrate = 30000
minimum_fps_target = 0
hevc_mode = 2
av1_mode = 1

upnp = disabled
address_family = ipv4
origin_web_ui_allowed = pc
lan_encryption_mode = 2
wan_encryption_mode = 2
ping_timeout = 10000

file_apps = apps.json
